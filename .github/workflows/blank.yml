name: Build CapKeep v0.1.0 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build Android APK
        working-directory: CapKeep_v0.1.0
        run: gradle assembleDebug

      - name: Prepare APK artifact
        run: cp CapKeep_v0.1.0/app/build/outputs/apk/debug/app-debug.apk CapKeep_v0.1.0-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CapKeep_v0.1.0-debug-APK
          path: CapKeep_v0.1.0-debug.apk
