name: Build CapKeep APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Find or extract latest project
        id: project
        shell: bash
        run: |
          SETTINGS_FILE=$(find . -type f -name "settings.gradle" | sort -V | tail -n 1)
          if [ -z "$SETTINGS_FILE" ]; then
            ZIP_FILE=$(find . -type f -iname "CapKeep*.zip" | sort -V | tail -n 1)
            if [ -z "$ZIP_FILE" ]; then
              echo "CapKeep project or ZIP not found"
              exit 1
            fi
            mkdir -p extracted_capkeep
            unzip -q -o "$ZIP_FILE" -d extracted_capkeep
            SETTINGS_FILE=$(find extracted_capkeep -type f -name "settings.gradle" | sort -V | tail -n 1)
          fi
          if [ -z "$SETTINGS_FILE" ]; then
            echo "settings.gradle not found"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          echo "directory=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
      - name: Prepare fixed signing key
        id: signing
        shell: bash
        env:
          CAPKEEP_KEYSTORE_BASE64: ${{ secrets.CAPKEEP_KEYSTORE_BASE64 }}
          CAPKEEP_KEYSTORE_PASSWORD: ${{ secrets.CAPKEEP_KEYSTORE_PASSWORD }}
          CAPKEEP_KEY_ALIAS: ${{ secrets.CAPKEEP_KEY_ALIAS }}
          CAPKEEP_KEY_PASSWORD: ${{ secrets.CAPKEEP_KEY_PASSWORD }}
        run: |
          if [ -z "$CAPKEEP_KEYSTORE_BASE64" ] || [ -z "$CAPKEEP_KEYSTORE_PASSWORD" ] || [ -z "$CAPKEEP_KEY_ALIAS" ] || [ -z "$CAPKEEP_KEY_PASSWORD" ]; then
            echo "CapKeep signing secrets are missing"
            exit 1
          fi
          KEYSTORE_PATH="$RUNNER_TEMP/CapKeep-release.jks"
          printf '%s' "$CAPKEEP_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          keytool -list -keystore "$KEYSTORE_PATH" -storepass "$CAPKEEP_KEYSTORE_PASSWORD" > /dev/null
          echo "path=$KEYSTORE_PATH" >> "$GITHUB_OUTPUT"
      - name: Build signed Android APK
        env:
          CAPKEEP_KEYSTORE_PATH: ${{ steps.signing.outputs.path }}
          CAPKEEP_KEYSTORE_PASSWORD: ${{ secrets.CAPKEEP_KEYSTORE_PASSWORD }}
          CAPKEEP_KEY_ALIAS: ${{ secrets.CAPKEEP_KEY_ALIAS }}
          CAPKEEP_KEY_PASSWORD: ${{ secrets.CAPKEEP_KEY_PASSWORD }}
        run: gradle -p "${{ steps.project.outputs.directory }}" assembleRelease
      - name: Prepare signed APK
        shell: bash
        run: |
          APK_FILE=$(find "${{ steps.project.outputs.directory }}" -type f -path "*/outputs/apk/release/*.apk" | head -n 1)
          test -n "$APK_FILE"
          cp "$APK_FILE" CapKeep-signed-update.apk
      - uses: actions/upload-artifact@v4
        with:
          name: CapKeep-signed-update-APK
          path: CapKeep-signed-update.apk
