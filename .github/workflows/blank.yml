name: Build CapKeep APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Find latest project
        id: project
        shell: bash
        run: |
          SETTINGS_FILE=$(find . -type f -name "settings.gradle" | sort -V | tail -n 1)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "settings.gradle 파일을 찾을 수 없습니다."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          echo "최신 프로젝트 위치: $PROJECT_DIR"
          echo "directory=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Build Android APK
        shell: bash
        run: |
          gradle -p "${{ steps.project.outputs.directory }}" assembleDebug

      - name: Find completed APK
        shell: bash
        run: |
          APK_FILE=$(find "${{ steps.project.outputs.directory }}" \
            -type f \
            -path "*/outputs/apk/debug/*.apk" \
            | head -n 1)

          if [ -z "$APK_FILE" ]; then
            echo "완성된 APK를 찾을 수 없습니다."
            exit 1
          fi

          cp "$APK_FILE" CapKeep-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CapKeep-debug-APK
          path: CapKeep-debug.apk
