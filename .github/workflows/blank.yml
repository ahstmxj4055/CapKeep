name: Build CapKeep v0.1.0 APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle assembleDebug
      - run: cp app/build/outputs/apk/debug/app-debug.apk CapKeep_v0.1.0-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: CapKeep_v0.1.0-debug-APK
          path: CapKeep_v0.1.0-debug.apk
